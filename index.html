<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Gerador de Assinatura de E-mail</title>

  <!-- Fonte Open Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Gerador de Assinatura de E-mail</h1>

    <div class="form">
      <input type="text" id="nome" placeholder="Nome completo" />
      <input type="text" id="cargo" placeholder="Cargo" />
      <input type="email" id="email" placeholder="E-mail" />
      <input type="text" id="whatsapp" placeholder="WhatsApp (ex: 11 99999-9999)" />
      <input type="file" id="foto" accept="image/*" />

      <button type="button" onclick="gerarAssinatura()">Gerar assinatura</button>
      <button type="button" onclick="copiarAssinatura()">Copiar assinatura</button>
    </div>

    <h2>Preview:</h2>
    <div id="preview" class="preview"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
